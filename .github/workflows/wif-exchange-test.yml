name: wif-exchange-test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
      - name: Exchange, then Messages calls with increasing max_tokens
        run: |
          resp=$(curl -sS https://api.anthropic.com/v1/oauth/token -H "content-type: application/json" --data @- <<JSON
          {"grant_type":"urn:ietf:params:oauth:grant-type:jwt-bearer","assertion":"$JWT",
           "federation_rule_id":"fdrl_014i6mVkMJG7N84HBzdnr9ch",
           "organization_id":"9e396bea-64ac-4ec3-b30a-483bbbf0b805",
           "service_account_id":"svac_0196kZwByri8hG9BLAZD2R7H",
           "workspace_id":"wrkspc_01Cb3FmbDkgCwFVg3NqyYDST"}
          JSON
          )
          AT=$(echo "$resp" | jq -r '.access_token // empty'); [ -n "$AT" ] && echo "::add-mask::$AT"
          [ -z "$AT" ] && { echo "$resp"; exit 1; }
          for mt in 20 8000 32000 64000; do
            out=$(curl -sS https://api.anthropic.com/v1/messages \
              -H "authorization: Bearer $AT" -H "anthropic-version: 2023-06-01" -H "content-type: application/json" \
              -d "{\"model\":\"claude-opus-5-5\",\"max_tokens\":$mt,\"messages\":[{\"role\":\"user\",\"content\":\"Say OK\"}]}")
            echo "max_tokens=$mt -> $(echo "$out" | jq -c '{type, error, text: (.content[0].text // null)}')"
          done
